<!DOCTYPE html>
<html lang="en">
<head>

  <title>Zack | Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">Zack</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="skills.html">Skills</a>
      <a href="education.html">Education</a>
      <a href="experience.html">Experience</a>
      <a class="active" href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="page contact-page">
    <h1>Contact <span>Me</span></h1>
    <p class="intro">Want to work together or just say hello? Send me a message.</p>

    <form class="contact-form" action="mailto:you@example.com" method="post" enctype="text/plain">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="message" rows="7" placeholder="Your Message" required></textarea>
      <button class="outline-button" type="submit">Send Message</button>
    </form>
  </main>
</body>
